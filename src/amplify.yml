version: 1
applications:
  - appRoot: src
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Create env file for Next.js server runtimes (doesn't print secrets)
            - rm -f .env.production
            - printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> .env.production
            - printf 'CONTACT_TO_EMAIL=%s\n' "$CONTACT_TO_EMAIL" >> .env.production

            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
